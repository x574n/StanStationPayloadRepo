name: Update payload catalog

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check upstream releases
        run: python3 scripts/update_catalog.py catalog.json
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- catalog.json; then
            echo 'Catalog is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git commit -m 'Automated payload catalog update'
          git push
